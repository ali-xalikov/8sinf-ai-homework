services:
  - type: web
    name: 8sinf-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: groq
      - key: OCR_ENABLED
        value: "false"
      - key: SESSION_DAYS
        value: "30"
      - key: ADMIN_USERNAME
        value: admin
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PUBLIC_BASE_URL
        value: https://eightsinf-ai-backend.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_API_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false